name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

# Serialize deploys: back-to-back merges to main run one at a time so the
# VPS never has two 'docker rm/pull/run' sequences interleaving (yesterday's
# 'container name already in use' race). Single-commit pushes are unaffected.
# cancel-in-progress is deliberately false: killing a job mid-SSH can leave the
# container removed with nothing running; queueing is always safe.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/notorious-backend:latest
            ghcr.io/${{ github.repository_owner }}/notorious-backend:${{ github.sha }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Create app directory if not exists
            mkdir -p ~/notorious/backend
            cd ~/notorious/backend

            # Create .env file from secrets
            cat <<EOF > .env
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            OPENSEARCH_ENDPOINT=${{ secrets.OPENSEARCH_ENDPOINT }}
            OPENSEARCH_INDEX=${{ secrets.OPENSEARCH_INDEX }}
            OPENSEARCH_INDICES=${{ secrets.OPENSEARCH_INDICES }}
            S3_UPLOAD_BUCKET=${{ secrets.S3_UPLOAD_BUCKET }}
            S3_UPLOAD_PREFIX=${{ secrets.S3_UPLOAD_PREFIX }}
            OPENSEARCH_MASTER_USER=${{ secrets.OPENSEARCH_MASTER_USER }}
            OPENSEARCH_MASTER_PASSWORD=${{ secrets.OPENSEARCH_MASTER_PASSWORD }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INGEST_BATCH_SIZE=${{ secrets.INGEST_BATCH_SIZE }}
            INGEST_WORKER_MULTIPLIER=${{ secrets.INGEST_WORKER_MULTIPLIER }}
            # Web push (VAPID). Unset/cleared secrets simply disable OS pushes;
            # the in-app bell keeps working either way.
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
            GIN_MODE=release
            PORT=8080
            EOF

            # Package is public: pull anonymously (clear any stale credentials)
            docker logout ghcr.io >/dev/null 2>&1 || true

            # Stop existing container if it exists
            docker rm -f notorious-backend || true

            # Pull the latest image
            docker pull ghcr.io/${{ github.repository_owner }}/notorious-backend:latest

            # Start the container natively
            docker run -d \
              --name notorious-backend \
              --restart always \
              --network host \
              --env-file .env \
              ghcr.io/${{ github.repository_owner }}/notorious-backend:latest

            # Cleanup old images
            docker image prune -f
