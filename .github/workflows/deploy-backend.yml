name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/notorious-backend:latest
            ghcr.io/${{ github.repository_owner }}/notorious-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create app directory if not exists
            mkdir -p ~/notorious/backend
            cd ~/notorious/backend

            # Create .env file from secrets
            cat <<EOF > .env
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            OPENSEARCH_ENDPOINT=${{ secrets.OPENSEARCH_ENDPOINT }}
            OPENSEARCH_INDEX=${{ secrets.OPENSEARCH_INDEX }}
            OPENSEARCH_INDICES='${{ secrets.OPENSEARCH_INDICES }}'
            S3_UPLOAD_BUCKET=${{ secrets.S3_UPLOAD_BUCKET }}
            S3_UPLOAD_PREFIX=${{ secrets.S3_UPLOAD_PREFIX }}
            OPENSEARCH_MASTER_USER=${{ secrets.OPENSEARCH_MASTER_USER }}
            OPENSEARCH_MASTER_PASSWORD=${{ secrets.OPENSEARCH_MASTER_PASSWORD }}
            DATABASE_URL='${{ secrets.DATABASE_URL }}'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INGEST_BATCH_SIZE=${{ secrets.INGEST_BATCH_SIZE }}
            INGEST_WORKER_MULTIPLIER=${{ secrets.INGEST_WORKER_MULTIPLIER }}
            GIN_MODE=release
            PORT=8080
            EOF

            # Create/Update docker-compose.yml on the server
            cat <<EOF > docker-compose.yml
            services:
              backend:
                image: ghcr.io/${{ github.repository_owner }}/notorious-backend:latest
                container_name: notorious-backend
                restart: always
                network_mode: host

                env_file:
                  - .env
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            EOF

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest image
            docker compose pull backend

            # Restart the service
            docker compose up -d

            # Cleanup old images
            docker image prune -f
