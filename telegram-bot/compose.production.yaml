services:
  bot:
    build:
      context: .
    image: shakil-intel-x:local
    restart: unless-stopped
    env_file:
      - .env.production
    network_mode: host
    volumes:
      - ./upi-qr.png:/run/shakil/upi-qr.png:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
